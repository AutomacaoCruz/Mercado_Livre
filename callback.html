<!DOCTYPE html>
<html>
<head>
  <title>Conectando...</title>
</head>
<body>

<h2>Conectando Mercado Livre...</h2>

<script>

const params = new URLSearchParams(window.location.search);

const code = params.get("code");

if(code){

  // salva localmente
  localStorage.setItem("ml_code", code);

  // avisa
  document.body.innerHTML =
    "<h2>Conta conectada com sucesso ✅</h2><p>Você pode fechar esta aba.</p>";

  // fecha sozinho depois
  setTimeout(() => {
    window.close();
  }, 2000);

}

</script>

</body>
</html>
