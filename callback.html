<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>OAuth</title>
</head>

<body>

<script>

const params = new URLSearchParams(window.location.search);

const code = params.get("code");

if(code){

  window.opener.Shiny.setInputValue(
    "ml_code",
    code,
    {priority: "event"}
  );

  window.close();

}

</script>

</body>

</html>
