<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Callback ML</title>
</head>

<body>

<h2>Conectando Mercado Livre...</h2>

<script>

const params = new URLSearchParams(window.location.search);

const code = params.get("code");

console.log(code);

if(window.opener && code){

    window.opener.postMessage(
      {
        type: "ML_CODE",
        code: code
      },
      "*"
    );

    document.body.innerHTML = `
      <h2>Conta conectada com sucesso ✅</h2>
      <p>Você pode fechar esta aba.</p>
    `;

    setTimeout(function(){

        window.close();

    }, 1500);

}

</script>

</body>
</html>
